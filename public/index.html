<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACM BOT 1</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; background: #070b16; color: #fff; font-family: Arial, sans-serif; }
    .header { text-align: center; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 28px; font-weight: 900; color: #5ee28f; }
    .sub { color: #9da8c3; font-size: 11px; margin-top: 4px; }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; margin-bottom: 14px; }
    .btn-off { background: #ff6b6b; color: #fff; }
    .btn-on { background: #5ee28f; color: #070b16; }
    .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    .card { background: #10182a; border: 1px solid #1e2940; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    .card-par { background: #10182a; border: 1px solid #1e2940; border-radius: 16px; padding: 12px; margin-bottom: 10px; }
    .title { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #9da8c3; }
    .par-name { font-size: 13px; font-weight: 800; color: #5ee28f; margin-bottom: 8px; }
    .big { font-size: 22px; font-weight: 800; }
    .danger { color: #ff6b6b; }
    .ok { color: #5ee28f; }
    .warn { color: #ffcc66; }
    .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1c2538; font-size: 12px; }
    .row:last-child { border-bottom: none; }
    .label { color: #9da8c3; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 800; }
    .badge-buy { background: #1a3a2a; color: #5ee28f; }
    .badge-sell { background: #3a1a1a; color: #ff6b6b; }
    .badge-hold { background: #2a2a1a; color: #ffcc66; }
    .hist-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; padding: 5px 0; border-bottom: 1px solid #1c2538; font-size: 11px; }
    .hist-row:last-child { border-bottom: none; }
    .pares-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    .footer { text-align: center; color: #8290b1; margin-top: 10px; font-size: 11px; }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧪 ACM BOT 1 — TESTNET</h1>
    <div class="sub">Motor ACM puro | Joaquin Hernandez | INPI</div>
  </div>

  <button class="btn btn-off" id="toggleBtn" onclick="toggleBot()">⏸ APAGAR BOT</button>

  <div class="grid2">
    <div class="card"><div class="title">💰 Balance</div><div class="big ok" id="balance">-</div></div>
    <div class="card"><div class="title">📈 PNL Total</div><div class="big" id="pnl">-</div></div>
    <div class="card"><div class="title">🏆 Wins / Losses</div><div class="big" id="wl">-</div></div>
    <div class="card"><div class="title">🔥 Racha</div><div class="big" id="streak">-</div></div>
  </div>

  <div class="title" style="color:#fff; font-size:14px; margin-bottom:8px;">📊 Pares en vivo</div>
  <div class="pares-grid" id="pares-container"></div>

  <div class="card">
    <div class="title">📋 Historial</div>
    <div class="hist-row" style="color:#9da8c3; font-weight:700;">
      <span>Par</span><span>Lado</span><span>Result</span><span>PNL</span>
    </div>
    <div id="history-table"><span style="color:#9da8c3">Sin trades aun</span></div>
  </div>

  <div class="footer pulse" id="updated">Conectando...</div>
  <div class="footer">🧪 ACM BOT 1 | Joaquin Hernandez 🇦🇷</div>

  <script>
    const ICONOS = { BTCUSDT:"₿", ETHUSDT:"⟠", SOLUSDT:"◎", ADAUSDT:"🔵", ALGOUSDT:"⚡" };

    function formatAccion(action) {
      if (action === "BUY") return '<span class="badge badge-buy">▲ COMPRAR</span>';
      if (action === "SELL") return '<span class="badge badge-sell">▼ VENDER</span>';
      return '<span class="badge badge-hold">◆ HOLD</span>';
    }

    function formatEstado(status) {
      if (status === "ON" || status === "CONNECTED") return '<span class="ok">● ON</span>';
      return '<span class="danger">● OFF</span>';
    }

    function renderPares(pares) {
      if (!pares) return;
      const container = document.getElementById("pares-container");
      container.innerHTML = "";
      Object.entries(pares).forEach(([symbol, par]) => {
        const icono = ICONOS[symbol] || "○";
        const nombre = symbol.replace("USDT", "/USDT");
        const decimales = ["BTCUSDT","ETHUSDT"].includes(symbol) ? 2 : 5;
        const v = par.variables || {};
        const div = document.createElement("div");
        div.className = "card-par";
        div.innerHTML = `
          <div class="par-name">${icono} ${nombre}</div>
          <div class="row"><span class="label">Precio</span><span>$${(par.price||0).toFixed(decimales)}</span></div>
          <div class="row"><span class="label">Estado</span><span>${formatEstado(par.engineStatus)}</span></div>
          <div class="row"><span class="label">Accion</span><span>${formatAccion(par.finalAction)}</span></div>
          <div class="row"><span class="label">Confianza</span><span>${par.confianzaACM||0}%</span></div>
          <div class="row"><span class="label">Lado</span><span>${par.position?par.position.side:"-"}</span></div>
          <div class="row"><span class="label">Coherencia</span><span>${v.coherencia??"-"}</span></div>
          <div class="row"><span class="label">Momentum</span><span>${v.momentum??"-"}</span></div>
        `;
        container.appendChild(div);
      });
    }

    function update() {
      fetch("/api/status")
        .then(r => r.json())
        .then(d => {
          const bal = d.balance || 0;
          const balEl = document.getElementById("balance");
          balEl.textContent = "$" + bal.toFixed(2);
          balEl.className = "big " + (bal >= 100 ? "ok" : "danger");
          const pnl = d.pnl || 0;
          const pnlEl = document.getElementById("pnl");
          pnlEl.textContent = (pnl >= 0 ? "+" : "") + pnl.toFixed(4);
          pnlEl.className = "big " + (pnl >= 0 ? "ok" : "danger");
          document.getElementById("wl").textContent = (d.wins||0) + "W / " + (d.losses||0) + "L";
          const streak = d.streak || 0;
          const streakEl = document.getElementById("streak");
          streakEl.textContent = (streak > 0 ? "+" : "") + streak;
          streakEl.className = "big " + (streak > 0 ? "ok" : streak < 0 ? "danger" : "warn");
          const btn = document.getElementById("toggleBtn");
          if (d.botActivo) { btn.textContent = "⏸ APAGAR BOT"; btn.className = "btn btn-off"; }
          else { btn.textContent = "▶ ENCENDER BOT"; btn.className = "btn btn-on"; }
          renderPares(d.pares);
          const hist = d.history || [];
          if (hist.length === 0) {
            document.getElementById("history-table").innerHTML = '<span style="color:#9da8c3">Sin trades aun</span>';
          } else {
            document.getElementById("history-table").innerHTML = hist.slice(-15).reverse().map(h => {
              const color = h.resultado === "WIN" ? "#5ee28f" : "#ff6b6b";
              return `<div class="hist-row">
                <span>${(h.symbol||"BTC").replace("USDT","")}</span>
                <span>${h.side}</span>
                <span style="color:${color}">${h.resultado}</span>
                <span style="color:${color}">${h.pnl>=0?"+":""}${h.pnl}</span>
              </div>`;
            }).join("");
          }
          document.getElementById("updated").textContent = "⏱ " + new Date(d.updatedAt).toLocaleTimeString();
        })
        .catch(() => { document.getElementById("updated").textContent = "⚠ Reconectando..."; });
    }

    update();
    setInterval(update, 2000);

    function toggleBot() {
      fetch("/api/toggle", { method: "POST" }).then(() => update());
    }
  </script>
</body>
</html>
